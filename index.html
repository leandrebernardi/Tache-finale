<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tache Finale | Léandre Bernardi | 5D</title>
    <!-- Chargement des icônes FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Variables pour le Mode Clair */
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --wrapper-bg: rgba(0, 0, 0, 0.03);
            --wrapper-border: rgba(255, 255, 255, 0.8);
            --toggle-bg: #e4e8f0;
            --toggle-color: #1d1d1f;
        }

        /* Variables pour le Mode Sombre */
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #121214 0%, #1a1a22 100%);
            --card-bg: rgba(28, 28, 30, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-sub: #a1a1a6;
            --wrapper-bg: rgba(255, 255, 255, 0.04);
            --wrapper-border: rgba(0, 0, 0, 0.2);
            --toggle-bg: #2c2c2e;
            --toggle-color: #f5f5f7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.4s ease;
        }

        /* Animation Fade-in au chargement */
        .player-container {
            width: 100%;
            max-width: 540px;
            padding: 35px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            position: relative;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(134, 134, 139, 0.15);
            padding-bottom: 15px;
        }

        .project-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        /* Style spécifique pour votre Logo Corse.png */
        .page-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.15));
            border-radius: 50%;
        }

        .theme-toggle {
            background: var(--toggle-bg);
            color: var(--toggle-color);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .audio-wrapper {
            background: var(--wrapper-bg);
            border: 1px solid var(--wrapper-border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .audio-info {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 12px;
        }

        audio {
            width: 100%;
            height: 40px;
            outline: none;
        }

        .streaming-links {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(134, 134, 139, 0.1);
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .streaming-title {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
            width: 100%;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .badge-btn {
            display: inline-flex;
            align-items: center;
            background-color: #1d1d1f;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            padding: 8px 14px;
            flex: 1;
            min-width: 135px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .badge-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            background-color: #000000;
        }

        .badge-btn i {
            font-size: 24px;
            margin-right: 10px;
            transition: color 0.2s;
        }

        .badge-text {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }

        .badge-text .small-txt {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #aeaeb2;
        }

        .badge-text .brand-txt {
            font-size: 14px;
            font-weight: 600;
        }

        .spotify:hover i { color: #1ed760; }
        .apple:hover i { color: #fc3c44; }
        .deezer:hover i { color: #ffd300; }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .streaming-links { flex-direction: column; }
            .badge-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="player-container">
        
        <!-- En-tête avec votre logo Corse.png -->
        <div class="header-bar">
            <div class="project-title">
                <img src="Corse.png" alt="Logo Corse" class="page-logo">
                <span>Tache Finale | Léandre Bernardi | 5D</span>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème">
                <i class="fa-solid fa-moon"></i>
                <span id="toggleText">Sombre</span>
            </button>
        </div>

        <!-- Lecteur audio autonome racine -->
        <div class="audio-wrapper">
            <div class="audio-info">Léandre Bernardi — Alla Fiera dell'Est (live, 1977)</div>
            <audio controls>
                <source src="alla-fiera.mp3" type="audio/mpeg">
                Votre navigateur ne prend pas en charge l'écoute de ce morceau.
            </audio>
        </div>

        <!-- Badges de streaming -->
        <div class="streaming-links">
            <div class="streaming-title">Écouter la version originale :</div>
            
            <!-- Spotify -->
            <a href="https://spotify.com" class="badge-btn spotify" target="_blank">
                <i class="fa-brands fa-spotify"></i>
                <div class="badge-text">
                    <span class="small-txt">Listen on</span>
                    <span class="brand-txt">Spotify</span>
                </div>
            </a>

            <!-- Apple Music -->
            <a href="https://apple.com" class="badge-btn apple" target="_blank">
                <i class="fa-brands fa-apple"></i>
                <div class="badge-text">
                    <span class="small-txt">Listen on</span>
                    <span class="brand-txt">Music</span>
                </div>
            </a>

            <!-- Deezer -->
            <a href="https://deezer.com" class="badge-btn deezer" target="_blank">
                <i class="fa-brands fa-deezer"></i>
                <div class="badge-text">
                    <span class="small-txt">Listen on</span>
                    <span class="brand-txt">Deezer</span>
                </div>
            </a>
        </div>
    </div>

    <!-- Script JavaScript pour basculer de mode -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const toggleIcon = themeToggleBtn.querySelector('i');
        const toggleText = document.getElementById('toggleText');

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateToggleInterface(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateToggleInterface(newTheme);
        });

        function updateToggleInterface(theme) {
            if (theme === 'dark') {
                toggleIcon.className = 'fa-solid fa-sun';
                toggleText.innerText = 'Clair';
            } else {
                toggleIcon.className = 'fa-solid fa-moon';
                toggleText.innerText = 'Sombre';
            }
        }
    </script>

</body>
</html>
