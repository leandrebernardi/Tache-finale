<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tache Finale | Léandre Bernardi | 5D</title>
    <!-- Chargement de la bibliothèque d'icônes -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Interstate', 'Lucida Grande', Arial, sans-serif;
            background-color: #fcfcfc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            width: 100%;
            max-width: 700px;
            padding: 25px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .project-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #222;
            margin-bottom: 20px;
            border-bottom: 2px solid #f4f4f4;
            padding-bottom: 12px;
        }
        .project-title i {
            color: #ac9484;
            font-size: 22px;
        }
        
        /* Style du nouveau lecteur audio natif */
        .audio-wrapper {
            background: #f1f3f4;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .audio-info {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        audio {
            width: 100%;
            outline: none;
        }

        .streaming-links {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .streaming-title {
            font-size: 12px;
            color: #666;
            font-weight: bold;
            width: 100%;
            margin-bottom: 8px;
        }
        .badge-btn {
            display: inline-flex;
            align-items: center;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 7px;
            padding: 6px 14px;
            min-width: 140px;
            border: 1px solid #222;
            transition: transform 0.2s, background-color 0.2s;
        }
        .badge-btn:hover {
            transform: scale(1.02);
            background-color: #111;
        }
        .badge-btn i {
            font-size: 22px;
            margin-right: 10px;
        }
        .badge-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .badge-text .small-txt {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #dfdfdf;
        }
        .badge-text .brand-txt {
            font-size: 15px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }
        .spotify:hover i { color: #1ed760; }
        .apple:hover i { color: #fc3c44; }
        .deezer:hover i { color: #a238ff; }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Titre de la page avec icône -->
        <div class="project-title">
            <i class="fa-solid fa-music"></i> 
            <span>Tache Finale | Léandre Bernardi | 5D</span>
        </div>

        <!-- LECTEUR AUDIO SÉCURISÉ LISANT DIRECTEMENT VOTRE MP3 -->
        <div class="audio-wrapper">
            <div class="audio-info">Léandre Bernardi - Alla Fiera dell'Est (live, 1977)</div>
            <audio controls>
                <source src="alla-fiera.mp3" type="audio/mpeg">
                Votre navigateur ne prend pas en charge l'écoute de ce fichier audio.
            </audio>
        </div>

        <!-- Liens vers les plateformes officielles -->
        <div class="streaming-links">
            <div class="streaming-title">Écouter la version originale :</div>
            
            <a href="https://spotify.com" class="badge-btn spotify" target="_blank">
                <i class="fa-brands fa-spotify"></i>
                <div class="badge-text">
                    <span class="small-txt">Listen on</span>
                    <span class="brand-txt">Spotify</span>
                </div>
            </a>

            <a href="https://apple.com" class="badge-btn apple" target="_blank">
                <i class="fa-brands fa-apple"></i>
                <div class="badge-text">
                    <span class="small-txt">Listen on</span>
                    <span class="brand-txt">Music</span>
                </div>
            </a>

            <a href="https://deezer.com" class="badge-btn deezer" target="_blank">
                <i class="fa-brands fa-deezer"></i>
                <div class="badge-text">
                    <span class="small-txt">Listen on</span>
                    <span class="brand-txt">Deezer</span>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
