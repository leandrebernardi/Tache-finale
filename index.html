<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tache Finale | Léandre Bernardi | 5D</title>
    <link rel="icon" type="image/png" href="Corse.png">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --wrapper-bg: rgba(0, 0, 0, 0.03);
            --wrapper-border: rgba(255, 255, 255, 0.8);
            --toggle-bg: #e4e8f0;
            --toggle-color: #1d1d1f;
        }
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #121214 0%, #1a1a22 100%);
            --card-bg: rgba(28, 28, 30, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-sub: #a1a1a6;
            --wrapper-bg: rgba(255, 255, 255, 0.04);
            --wrapper-border: rgba(0, 0, 0, 0.2);
            --toggle-bg: #2c2c2e;
            --toggle-color: #f5f5f7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.4s ease;
        }
        .player-container {
            width: 100%;
            max-width: 540px;
            padding: 35px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            opacity: 0;
            transform: translateY(15px);
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(134, 134, 139, 0.15);
            padding-bottom: 15px;
        }
        .project-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
        }
        .page-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 50%;
        }
        .theme-toggle {
            background: var(--toggle-bg);
            color: var(--toggle-color);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .audio-wrapper {
            background: var(--wrapper-bg);
            border: 1px solid var(--wrapper-border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
        }
        .audio-info {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 12px;
        }
        audio {
            width: 100%;
            height: 40px;
        }
        .streaming-links {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(134, 134, 139, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .streaming-title {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
            width: 100%;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-align: center;
        }
        /* Style unifié pour les conteneurs des trois logos */
        .badge-link {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-decoration: none !important;
            transition: transform 0.25s ease, filter 0.25s ease;
            max-width: 150px;
            flex: 1;
        }
        .badge-link:hover {
            transform: translateY(-4px);
        }
        /* Forçage d'une taille harmonisée pour les images de badges */
        .badge-link img {
            width: 100%;
            height: auto;
            max-height: 45px;
            object-fit: contain;
            border-radius: 8px;
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) {
            .streaming-links { flex-direction: column; gap: 20px; }
            .badge-link { width: 80%; }
        }
        .deezer-button {
          display: inline-flex;
          align-items: center;
          background-color: #121212; /* Fond noir style store */
          color: #FFFFFF;
          text-decoration: none;
          border-radius: 8px;
          padding: 8px 16px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          border: 1px solid #A238FF; /* Optionnel : liseré avec le violet emblématique */
          transition: background-color 0.2s ease;
        }
        
        .deezer-button:hover {
          background-color: #242424;
        }
        
        .deezer-icon {
          color: #A238FF; /* Le nouveau violet Deezer */
          margin-right: 12px;
        }
        
        .deezer-text {
          display: flex;
          flex-direction: column;
        }
        
        .deezer-caption {
          font-size: 9px;
          font-weight: bold;
          letter-spacing: 1px;
          color: #A0A0A0;
        }
        
        .deezer-brand {
          font-size: 18px;
          font-weight: 700;
          line-height: 1.2;
          max-width: 100%;
        }

    </style>
</head>
<body>

    <div class="player-container">
        
        <!-- En-tête -->
        <div class="header-bar">
            <div class="project-title">
                <img src="Corse.png" alt="Logo Corse" class="page-logo">
                <span>Tache Finale | Léandre Bernardi | 5D</span>
            </div>
            <button class="theme-toggle" id="themeToggle">
                <span id="toggleIcon">🌙</span>
                <span id="toggleText">Sombre</span>
            </button>
        </div>

        <!-- Lecteur audio autonome local -->
        <div class="audio-wrapper">
            <div class="audio-info">Léandre Bernardi — Alla Fiera dell'Est (live, 1977)</div>
            <audio controls>
                <source src="alla-fiera.mp3" type="audio/mpeg">
                Votre navigateur ne prend pas en charge l'écoute.
            </audio>
        </div>

        <!-- Section des liens de streaming (Uniquement les images officielles sans texte) -->
        <div class="streaming-links">
            <div class="streaming-title">Écouter la version originale :</div>
            
            <!-- Lien Spotify -->
            <a href="https://open.spotify.com/track/4vwVTiQj0TjisDsXzScAeb" class="badge-link" target="_blank">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSihDXsefRWW-wSzrYDhhuUQug6pWVsArV8B9h3IpJz-g&s=10" alt="Spotify">
            </a>

            <!-- Lien Apple Music -->
            <a href="https://music.apple.com/de/song/alla-fiera-dellest/1442769839?l=en-GB" class="badge-link" target="_blank">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQ6ByjWzVb6CmyDsaaHBY483UgsDBCd7v1cvk0M-EWgg&s=10" alt="Apple Music">
            </a>

            <!-- Lien Deezer (Texte retiré et remplacé par l'icône harmonisée) -->
                <a href="https://www.deezer.com/en/track/491567662" class="deezer-button" target="_blank" rel="noopener noreferrer">
                  <img src="https://static.vecteezy.com/system/resources/thumbnails/067/565/507/small/deezer-rounded-logo-design-free-png.png" class="deezer-brand" alt="Logo deezer">
                  <svg class="deezer-icon" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                  </svg>
                  <div class="deezer-text">
                    <span class="deezer-caption">ÉCOUTER SUR</span>
                    <span class="deezer-brand">Deezer</span>
                  </div>
                </a>
        </div>
    </div>

    <!-- Script de gestion de la mémoire du mode choisi -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const toggleIcon = document.getElementById('toggleIcon');
        const toggleText = document.getElementById('toggleText');

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateToggleInterface(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateToggleInterface(newTheme);
        });

        function updateToggleInterface(theme) {
            if (theme === 'dark') {
                toggleIcon.innerText = '☀️';
                toggleText.innerText = 'Clair';
            } else {
                toggleIcon.innerText = '🌙';
                toggleText.innerText = 'Sombre';
            }
        }
    </script>

</body>
</html>
