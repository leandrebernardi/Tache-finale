<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tache Finale | Léandre Bernardi | 5D</title>
    <link rel="icon" type="image/png" href="Corse.png">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --wrapper-bg: rgba(0, 0, 0, 0.03);
            --wrapper-border: rgba(255, 255, 255, 0.8);
            --toggle-bg: #e4e8f0;
            --toggle-color: #1d1d1f;
            --badge-bg: #ffffff;
            --badge-border: rgba(0, 0, 0, 0.08);
            --badge-text: #1d1d1f;
        }
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #121214 0%, #1a1a22 100%);
            --card-bg: rgba(28, 28, 30, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-sub: #a1a1a6;
            --wrapper-bg: rgba(255, 255, 255, 0.04);
            --wrapper-border: rgba(0, 0, 0, 0.2);
            --toggle-bg: #2c2c2e;
            --toggle-color: #f5f5f7;
            --badge-bg: #2c2c2e;
            --badge-border: rgba(255, 255, 255, 0.08);
            --badge-text: #f5f5f7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.4s ease;
        }
        .player-container {
            width: 100%;
            max-width: 540px;
            padding: 35px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            opacity: 0;
            transform: translateY(15px);
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(134, 134, 139, 0.15);
            padding-bottom: 15px;
        }
        .project-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
        }
        .page-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 50%;
        }
        .theme-toggle {
            background: var(--toggle-bg);
            color: var(--toggle-color);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .audio-wrapper {
            background: var(--wrapper-bg);
            border: 1px solid var(--wrapper-border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
        }
        .audio-info {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 12px;
        }
        audio {
            width: 100%;
            height: 40px;
        }
        .streaming-links {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(134, 134, 139, 0.1);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .streaming-title {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
            width: 100%;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .platform-badge {
            display: inline-flex;
            align-items: center;
            background-color: var(--badge-bg);
            border: 1px solid var(--badge-border);
            border-radius: 14px;
            padding: 8px 14px;
            flex: 1;
            min-width: 145px;
            text-decoration: none !important;
            color: var(--badge-text);
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .platform-badge:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .platform-badge img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin-right: 12px;
        }
        .badge-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .badge-text .small-txt {
            font-size: 8px;
            color: var(--text-sub);
            text-transform: uppercase;
        }
        .badge-text .brand-txt {
            font-size: 13px;
            font-weight: 600;
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) {
            .streaming-links { flex-direction: column; }
            .platform-badge { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="player-container">
        
        <!-- En-tête -->
        <div class="header-bar">
            <div class="project-title">
                <img src="Corse.png" alt="Logo Corse" class="page-logo">
                <span>Tache Finale | Léandre Bernardi | 5D</span>
            </div>
            <button class="theme-toggle" id="themeToggle">
                <span id="toggleIcon">🌙</span>
                <span id="toggleText">Sombre</span>
            </button>
        </div>

        <!-- Lecteur audio autonome local -->
        <div class="audio-wrapper">
            <div class="audio-info">Léandre Bernardi — Alla Fiera dell'Est (live, 1977)</div>
            <audio controls>
                <source src="alla-fiera.mp3" type="audio/mpeg">
                Votre navigateur ne prend pas en charge l'écoute.
            </audio>
        </div>

        <!-- Section des liens de streaming (Sans sous-lignage bleu) -->
        <div class="streaming-links">
            <div class="streaming-title">Écouter la version originale :</div>
            
            <!-- Lien Spotify -->
            <a href="https://spotify.com" class="platform-badge" target="_blank">
                <img src="https://googleapis.com" alt="Spotify">
                <div class="badge-text">
                    <span class="small-txt">Écouter sur</span>
                    <span class="brand-txt">Spotify</span>
                </div>
            </a>

            <!-- Lien Apple Music (Logo corrigé en icône d'application carrée) -->
            <a href="https://music.apple.com/us/song/alla-fiera-dellest/1443480954" class="platform-badge" target="_blank">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSihDXsefRWW-wSzrYDhhuUQug6pWVsArV8B9h3IpJz-g&s=10">
            </a>

            <!-- Lien Deezer -->
            <a href="https://www.deezer.com/fr/album/99684" class="platform-badge" target="_blank">
                <img src="https://vecteezy.com" alt="Deezer">
                <div class="badge-text">
                    <span class="small-txt">Écouter sur</span>
                    <span class="brand-txt">Deezer</span>
                </div>
            </a>
        </div>
    </div>

    <!-- Script de gestion de la mémoire du mode choisi -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const toggleIcon = document.getElementById('toggleIcon');
        const toggleText = document.getElementById('toggleText');

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateToggleInterface(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateToggleInterface(newTheme);
        });

        function updateToggleInterface(theme) {
            if (theme === 'dark') {
                toggleIcon.innerText = '☀️';
                toggleText.innerText = 'Clair';
            } else {
                toggleIcon.innerText = '🌙';
                toggleText.innerText = 'Sombre';
            }
        }
    </script>

</body>
</html>
